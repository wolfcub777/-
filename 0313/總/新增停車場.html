<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增停車場</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .container { width: 50%; margin: auto; padding: 20px; background: #f9f9f9; border-radius: 10px; }
        input, button { width: 90%; padding: 10px; margin: 10px; }
        button { background: #2ecc71; color: white; border: none; font-size: 18px; cursor: pointer; }
        button:hover { background: #27ae60; }
    </style>
</head>
<body>

<h1>新增停車場</h1>

<div class="container">
    <form action="新增停車場.php" method="post" enctype="multipart/form-data">
        <input type="text" name="name" placeholder="輸入停車場名稱" required>
        <input type="number" name="total_spots" placeholder="輸入總車位數" required min="1">
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">新增停車場</button>
    </form>
</div>

</body>
</html>
